name: sdist build + install

on:
  # Both lines are listed here on both lines, and that is deliberate. A push
  # event runs the workflow file *from the branch that was pushed*, so the
  # 1.9.x entry is inert in main's copy and the main entry is inert in
  # 1.9.x's. Keeping the two copies identical is what stops this file from
  # conflicting every time a fix is merged into both.
  #
  # Without 1.9.x here, the maintenance line had pull_request CI but no
  # post-merge CI at all: merging into it produced no run, so a merge that
  # broke something stayed invisible until somebody opened the next PR.
  push:
    branches: [main, 1.9.x]
  pull_request:

# The standard macOS runners are the bottleneck (a median wait of 7-9 h, p90 17-21 h, against 0 min on Linux), and every
# push to a pull request left the previous run queued. A pull request's older run is cancelled when it is pushed to
# again; runs for pushes to main and 1.9.x each get their own group, so every commit there keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full test suite (PUMI mesh-adaptation + Chrono FSI included).
          # conda-forge ships the scorec package (PUMI) on linux-64, osx-64,
          # linux-aarch64 and osx-arm64. As of scorec 4.2.1 *build 1* it ships
          # openmpi builds on osx-arm64 too (conda-forge/scorec-feedstock#32
          # removed the skip), so that platform is no longer restricted to the
          # mpich environment file -- but 2.2.8 and 4.1.0 remain mpich-only
          # there, so the >=4.2.1 floor in the environment files is what makes
          # the openmpi file solvable on Apple Silicon.
          #
          # Runner labels: use macos-15-intel for x86_64 and macos-15 for arm64.
          # macos-13 is retired and macos-14 is deprecated; a job whose runs-on
          # label no runner satisfies does not fail fast -- it sits queued until
          # GitHub's 24h ceiling kills it, and because one queued job keeps the
          # whole run non-terminal, the other legs' logs stay unreadable while
          # it waits. Every run from 2026-08-12 (when the macos-13 leg was added)
          # to 2026-08-23 died that way at exactly 24h0m.
          # No py3.11 leg: the floors cannot be satisfied there. numpy >=2.5.2 has
          # cp312/cp313/cp314 builds only (the newest with a py3.11 build is 2.4.6),
          # and scipy >=1.18.0 requires python >=3.12. Lowering the floors to admit
          # py3.11 is what pulled in the 2018 openblas described below, so the leg
          # goes rather than the floors.
          - name: linux-64 / py3.12
            os: ubuntu-latest
            python: "3.12.5"
            env_file: environment-openmpi-dev.yml
          # This leg's python matches the pin in the environment files, so it is the
          # one that tests the committed lock verbatim; the others relax it.
          - name: linux-64 / py3.13 (locked)
            os: ubuntu-latest
            python: "3.13.15"
            env_file: environment-openmpi-dev.yml
          - name: macos-15 (Intel) / py3.12
            os: macos-15-intel
            python: "3.12.5"
            env_file: environment-openmpi-dev.yml
          # These two ran without PUMI/Chrono while conda-forge lacked the binaries
          # and while pychrono crashed on osx-arm64. Both reasons are gone: scorec
          # 4.2.1 and pychrono 10.0.0 are published for linux-64, osx-64,
          # linux-aarch64 and osx-arm64 (py3.10-3.14), and with pychrono 10.0.0
          # `import pychrono` succeeds on osx-arm64 both alone and after proteus's own
          # C extensions -- the ChVector3 SWIG overload crash was a 9.0.1 problem.
          # Confirmed by full-suite runs with PUMI and Chrono included: osx-arm64
          # 527/5/0 (all three environment files) and linux-aarch64 526/6/0 (both).
          # The macOS leg keeps the mpich file so one leg still exercises it.
          - name: linux-aarch64 / py3.12
            os: ubuntu-24.04-arm
            python: "3.12.5"
            env_file: environment-openmpi-dev.yml
          - name: macos-15 (Apple Silicon) / py3.12
            os: macos-15
            python: "3.12.5"
            env_file: environment-mpich-dev.yml
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build environment file for this leg
        shell: bash
        run: |
          cp "${{ matrix.env_file }}" environment-ci.yml
          # the openmpi/mpich files declare different env names; normalize so
          # activate-environment below matches whichever one this leg copied
          sed -i.bak "s/^name: .*/name: proteus-dev/" environment-ci.yml
          FILE_PY=$(sed -n 's/^  - python =\(.*\)$/\1/p' environment-ci.yml)
          if [ "${{ matrix.python }}" = "$FILE_PY" ]; then
            # This leg's python IS the one the file pins, so use the file verbatim:
            # that is the only leg that actually tests the committed lock.
            echo "-- python ${{ matrix.python }} matches the file's pin; using the lock as-is"
          else
            # Every exact "=x.y.z" pin in the dev environment files is part of one
            # lock chosen together with python =$FILE_PY, and many of those builds
            # are python-ABI-specific, so overriding python alone is unsatisfiable.
            # That is why the py3.11 leg failed at "Set up conda environment" rather
            # than at the tests: numpy =2.5.2 has cp312/cp313/cp314 builds only
            # (highest with py3.11 is 2.4.6), and behind it scipy =1.18.0 requires
            # python >=3.12. 37 packages are exactly pinned; relaxing them one at a
            # time is whack-a-mole, so relax the versions wholesale for off-lock legs.
            #
            # Convert to a FLOOR, never remove. An earlier version of this step
            # dropped the pins outright and that broke both linux-64 legs: with
            # "openblas =0.3.34" reduced to bare "openblas", the solver selected
            # openblas 0.3.4 -- a 2018 build, since 0.3.4 sorts BELOW 0.3.34 -- whose
            # dependency is "libgfortran >=3.0". The environment installs libgfortran
            # 16 (libgfortran.so.5), so proteus.superluWrappers linked against a
            # libgfortran.so.3 that is not present, and all 71 test modules failed to
            # import. Unconstrained is not the same as latest: the solver will reach
            # backwards to satisfy an awkward constraint.
            #
            # Build-string selectors are preserved either way:
            # "hdf5 =1.14.6=*openmpi*" becomes "hdf5 >=1.14.6=*openmpi*", never
            # "hdf5". Dropping the selector lets the solver pick h5py-*-nompi_*, a
            # serial HDF5, and a flood of "h5py was built without MPI support"
            # failures. Verified on linux-64 py3.12: 376 packages, openblas 0.3.34,
            # h5py mpi_openmpi_*, libgfortran 16.1.0.
            echo "-- python ${{ matrix.python }} differs from the file's pin $FILE_PY; converting exact pins to floors"
            sed -i.bak -E 's/^(  - [a-z0-9_.-]+) *=([0-9][^ =]*)(=[^ ]*)$/\1 >=\2\3/' environment-ci.yml
            sed -i.bak -E 's/^(  - [a-z0-9_.-]+) *=([0-9][^ =]*)$/\1 >=\2/' environment-ci.yml
            # pytest 9.2.0 breaks pytest-forked 1.7.5: every test it forks reports "running the
            # test EXITED with status 3" (556 of 556 on linux-aarch64, PR #1292). The floor
            # above would take 9.2.0; the exact pins that other legs use keep 9.1.1.
            sed -i.bak -E 's/^(  - pytest) *>=([0-9][^ ,]*)$/\1 >=\2,<9.2/' environment-ci.yml
            sed -i.bak "s/^  - python >=.*/  - python =${{ matrix.python }}/" environment-ci.yml
          fi
          rm -f environment-ci.yml.bak
          cat environment-ci.yml
      - name: Set up conda environment with PETSc/MPI/HDF5
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment-ci.yml
          activate-environment: proteus-dev

      - name: Build sdist
        shell: bash -l {0}
        run: |
          pip install build
          python -m build --sdist

      - name: Install sdist with default build isolation
        shell: bash -l {0}
        run: pip install dist/proteus-*.tar.gz

      - name: Smoke test
        shell: bash -l {0}
        run: |
          cd /tmp
          python -c "import proteus; from proteus import Comm; Comm.init(); print(proteus.__file__)"

      - name: Run test suite
        shell: bash -l {0}
        run: |
          export MPLBACKEND="AGG"
          # OpenBLAS's pthread-based threading isn't fork-safe: a child forked
          # by pytest-forked can inherit the parent's BLAS thread-pool state
          # and abort (SIGABRT) the first time it calls into BLAS/LAPACK, even
          # for something as innocuous as numpy.polynomial.legendre.leggauss
          # at module-import time (proteus/Quadrature.py). Seen as
          # "Fatal Python error: Aborted" during test collection on the
          # arm64 macOS leg (macos-14 at the time; now macos-15). Force
          # single-threaded BLAS instead.
          export OPENBLAS_NUM_THREADS=1
          export OMP_NUM_THREADS=1
          # Open MPI picks UCX for point-to-point, and on a runner whose network card is an
          # Azure MANA one (some ubuntu-24.04-arm VMs; others have none) UCX tries
          # ud_verbs/mana_0, fails with "Address not valid", and MPI_Init aborts: every
          # multi-process test then fails (19 on linux-aarch64, PR #1301) while the single-process
          # ones pass. The runner needs no RDMA transport, so use the plain ob1 path. MPICH
          # ignores the variable.
          export OMPI_MCA_pml=ob1
          mkdir test_output && cd test_output
          # These are known-failing (real numerics/environment issues, not
          # collection errors) and deliberately left unskipped in source so
          # they stay visible for a future fix session -- deselected here
          # only so this workflow's own signal isn't drowned out by known
          # failures. Remove each line as it gets fixed.
          DESELECT_ARGS=(
            # DO NOT deselect test_nse_RANS2P_step.py::test_step_slip_FullRun.
            # It fails an iteration-count assertion (see below), but it is also the
            # PRODUCER of dump_test_1_step2d_1.0par_j_0, which
            # test_amg_iteration_matrix_slip and test_amg_step_problem_slip load via
            # LAT.petsc_load_matrix. Those dumps are not in the repo -- they are
            # side-effects of runTest(ns,'test_1') -- and petsc_load_matrix returns
            # None on a missing file instead of raising, so the consumers die with
            # "AttributeError: 'NoneType' object has no attribute 'getSizes'".
            # Deselecting the producer therefore turns one honest tolerance failure
            # into three. Verified: the dump is written before the failing assertion,
            # and with it present both AMG slip tests pass.
            #   (test_step_noslip_FullRun -> runTest(ns,'test_2') -> dump_test_2_*
            #    feeds the *_noslip AMG tests the same way.)
            #
            # The real, reproducible failure to run down is the drift in
            # test_nse_RANS2P_step.py:184, "assert L3[0][1] == pytest.approx(10, rel=0.1)":
            #   expected  10 +/- 1
            #   linux-64  14
            #   osx-arm64 15   (measured directly, conda-dev-openmpi)
            # L1 (==2) and L2 (approx 11, rel=0.1) both still pass, so only the third
            # KSP solve has drifted. The assertion was already loosened once in
            # 133731a6 when the count came in at 11, so this is the second drift in the
            # same place -- 10 -> 11 -> 14/15 -- which argues for finding the cause
            # rather than widening the tolerance a third time.
          )
          # Research/manuscript directories under test/richards. These hold
          # parun input decks (*_p.py / *_n.py), notebooks and plotting
          # scripts for the WRR paper -- not regression tests. Nothing in
          # them is collected today, but only by accident: pytest's default
          # python_files is "test_*.py *_test.py", and e.g.
          # bio2d/HYDRUS/l2_direction_test.py already matches the second
          # pattern (it is untracked, so CI has not seen it yet -- locally it
          # is a collection error, "No module named 'pandas'"). Ignoring the
          # directories outright means committing one of these decks cannot
          # silently add a case to this workflow.
          #
          # The supported Richards regression tests are test_richards.py plus
          # its test_1/, test_2_HYDRUS/, test_3/ deck directories and
          # comparison_files/; those stay collected.
          #
          # bio2d and bio2d_FCT are the same case, so both go. Raingarden,
          # Tracy_convergence and bio2d are untracked right now, so their
          # --ignore is a no-op until they are committed; pytest does not
          # error on an --ignore path that does not exist.
          IGNORE_ARGS=(
            --ignore=../test/richards/bio2d
            --ignore=../test/richards/bio2d_FCT
            --ignore=../test/richards/Raingarden
            --ignore=../test/richards/Tracy_convergence
            --ignore=../test/richards/WRR_input_files
            --ignore=../test/richards/WRR_draft
          )
          python -m pytest -v --forked --import-mode=importlib \
            "${DESELECT_ARGS[@]}" "${IGNORE_ARGS[@]}" ../test
