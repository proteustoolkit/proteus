# OpenMPI-based proteus-dev environment (default/recommended on Linux aarch64
# and x86_64). Full-functionality dev install: scorec/PUMI (mesh adaptation),
# zoltan, and pychrono (multibody/FSI) all included. See environment-mpich-dev.yml
# for the mpich-based alternative and README.md for platform notes on choosing
# between them.
name: proteus-dev-openmpi
channels:
  - conda-forge
  - nodefaults
dependencies:
  - pip =24.0
  - compilers
  - make =4.4.1
  - setuptools =73.0.1
  - cython =3.0.11
  - hdf5 =1.14.6=*openmpi*
  - h5py =3.16.0=*openmpi*
  - metis =5.1.0
  - openmpi =5.0.10
  - numpy =2.5.2
  - openblas =0.3.34
  - parmetis =4.0.3
  - petsc4py =3.25.4
  # =real_* is the scalar type, not a flavour preference. proteus is a
  # real-arithmetic code, and conda-forge ships petsc in real_*, complex_*,
  # cuda*_real_* and cuda*_complex_* variants of the same version. Without the
  # selector the solver is free to pick complex_*, and it will: the real builds
  # carry "hypre >=3.1.0,<3.2.0a0" while the complex ones declare no hypre
  # dependency at all, so once hypre 3.2.0 was published (2026-08-25 00:45 UTC)
  # every leg that floors these pins solved to petsc-complex + hypre 3.2.0. With
  # complex scalars every KSP returns a zero correction, so Newton neither
  # converges nor terminates: 37 tests failed and the elliptic_redist cases spun
  # 20+ minutes each over 23,000+ Newton iterations, taking linux-64 from 22m to
  # 2h47m and macOS Intel to 4h45m. The locked py3.13 leg was unaffected only
  # because its "hypre =3.1.0" excluded 3.2.0.
  # petsc4py needs no selector: its builds carry "petsc * real_*" themselves.
  - petsc =3.25.4=real_*
  - scorec >=4.2.1
  # Floored, not bare: a bare spec lets the solver reach backwards. Bare
  # "openblas" selected a 2018 build needing libgfortran.so.3 (0.3.4 sorts
  # below 0.3.34). >=7.0 rather than >=7.0.1 because osx-64/osx-arm64 have
  # only 7.0.0, and "superlu =7.0.1" was half of the macOS unsatisfiable core.
  - superlu >=7.0
  - superlu_dist =9.2.1
  - triangle =1.6
  - pychrono >=10.0.0
  - gmsh =4.12.2
  - matplotlib =3.9.2
  - mpi4py =4.1.2
  - pytest =9.1.1
  - pytest-cov >=7.0.0
  - coverage >=7.10
  - pytest-xdist =3.6.1
  - pytest-forked =1.7.5
  - scipy =1.18.0
  - tetgen =1.6.0
  - threadpoolctl >=3.5.0
  - python =3.13.15
  - pybind11 =3.1.0
  - eigen =5.0.1
  - zoltan >=3.901
  - hypre =3.1.0
  - mumps-mpi =5.8.2
  - scalapack =2.2.0
  - tbb =2021.13.0
  - zipp =3.20.1
  - parso =0.8.4
  - pycparser =2.22
  - cffi =1.17.1
  - sympy =1.13.2
  - strictyaml =1.7.3
  # proteus.Archiver now builds its XDMF/YMF metadata through ymf.archive,
  # so pyyaml is a runtime requirement rather than an incidental one. It must
  # be a build with the libyaml C extension: ymf.archive.require_libyaml()
  # errors without it, because the pure-Python dumper is ~3.2x slower and the
  # archive is written every timestep. conda-forge's pyyaml is built with it.
  - pyyaml =6.0.2
  # ymf itself has no conda-forge feedstock yet, so it is installed from git
  # until one exists. Replace this pip entry with a plain "- ymf" dependency
  # once the feedstock lands.
  #
  # proteus at runtime needs only the ymf core, whose one dependency is the
  # pyyaml above: Archiver writes the archive of record through ymf.archive.
  # But proteus also ships scripts/ymf_run, which composes and validates a
  # specification (ymf.closure -> ymf.compose, strictyaml) and turns it into
  # a Proteus problem (ymf.symbolic, sympy). So the front end is a *test*
  # dependency even though it is not a runtime one, which is why sympy and
  # strictyaml are pinned above rather than left to ymf[symbolic] -- pip
  # resolving that extra would pull its own sympy over conda's.
  #
  # Without them test_adr_problem's eight end-to-end cases skip, and
  # scripts/ymf_run is never exercised. pint (ymf[units]) stays out: nothing
  # proteus ships imports ymf.units.
  - pip:
    - git+https://github.com/proteustoolkit/ymf.git@main
    - git+https://github.com/proteustoolkit/ymf-import-gmsh.git@main
