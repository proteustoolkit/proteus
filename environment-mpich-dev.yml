# MPICH-based proteus-dev environment (alternative to environment-openmpi-dev.yml).
#
# On Linux aarch64, conda-forge's scorec build requires mpich>=5.0,<6.0a0 (or
# openmpi>=5.0.10,<6.0a0) -- older mpich (e.g. 4.2.2) is not an option once
# scorec/zoltan are included. Of the two aarch64-available mpich>=5.0 releases,
# 5.0.0 cannot even be used: conda-forge's aarch64 petsc=3.25.4 was compiled
# against mpich 5.0.1's mpi.h and petscsys.h hard-errors ("PETSc was configured
# with one MPICH mpi.h version but now appears to be compiling using an older
# MPICH mpi.h version") if you try to build against mpich 5.0.0 instead. So
# mpich =5.0.1 pinned below is not a cautious choice -- it is the only mpich
# version that builds this stack at all on aarch64 today.
#
# KNOWN BUG: mpich 5.0.1 on aarch64 has been observed to abort with
#   *** The MPI_Allreduce() function was called before MPI_INIT was invoked.
#   (exit code 14)
# during real PETSc/hypre solves (reproduced with test/solver_tests/
# test_bochev_pressure_stabilization.py, which uses pc_hypre_type=boomeramg).
# Plain mpi4py/h5py/petsc4py imports and proteus problem-definition loading are
# unaffected; the abort only showed up once an actual parallel BoomerAMG-based
# solve ran. Verified absent with mpich 4.2.2 (scorec-free env), confirming this
# is a mpich-5.0.1-specific regression, not a pre-existing proteus bug. No fix
# or workaround is known yet. If you hit this, prefer environment-openmpi-dev.yml
# instead -- OpenMPI 5.0.10 does not show this failure mode (but see that file's
# own caveat: OpenMPI is not fork()-safe, so whole-suite `pytest --forked` runs
# can show unrelated SIGSEGV crashes that don't occur when running test files
# individually).
#
# macOS: export FI_PROVIDER=tcp. MPICH runs over libfabric, whose default
# provider there ("sockets") busy-polls two threads at 100% CPU in every
# process from MPI_Init on, about three cores per rank. `import proteus` sets
# it on macOS unless it is already set; see README.md, "Choosing between
# OpenMPI and MPICH".
name: proteus-dev-mpich
channels:
  - conda-forge
  - nodefaults
dependencies:
  - pip =24.0
  - compilers
  - make =4.4.1
  - setuptools =73.0.1
  - cython =3.0.11
  - hdf5 =1.14.6=*mpich*
  - h5py =3.16.0=*mpich*
  - metis =5.1.0
  - mpich =5.0.1
  - numpy =2.5.2
  - openblas =0.3.34
  - parmetis =4.0.3
  - petsc4py =3.25.4
  # =real_* pins the scalar type; see environment-openmpi-dev.yml for why.
  - petsc =3.25.4=real_*
  - scorec >=4.2.1
  # Floored, not bare: a bare spec lets the solver reach backwards. Bare
  # "openblas" selected a 2018 build needing libgfortran.so.3 (0.3.4 sorts
  # below 0.3.34). >=7.0 rather than >=7.0.1 because osx-64/osx-arm64 have
  # only 7.0.0, and "superlu =7.0.1" was half of the macOS unsatisfiable core.
  - superlu >=7.0
  - superlu_dist =9.2.1
  - triangle =1.6
  - pychrono >=10.0.0
  - gmsh =4.12.2
  - matplotlib =3.9.2
  - mpi4py =4.1.2
  - pytest =9.1.1
  - pytest-cov >=7.0.0
  - coverage >=7.10
  - pytest-xdist =3.6.1
  - pytest-forked =1.7.5
  - scipy =1.18.0
  - tetgen =1.6.0
  - threadpoolctl >=3.5.0
  - python =3.13.15
  - pybind11 =3.1.0
  - eigen =5.0.1
  - zoltan >=3.901
  - hypre =3.1.0
  - mumps-mpi =5.8.2
  - scalapack =2.2.0
  - tbb =2021.13.0
  - zipp =3.20.1
  - parso =0.8.4
  - pycparser =2.22
  - cffi =1.17.1
  - sympy =1.13.2
  - strictyaml =1.7.3
  # proteus.Archiver now builds its XDMF/YMF metadata through ymf.archive,
  # so pyyaml is a runtime requirement rather than an incidental one. It must
  # be a build with the libyaml C extension: ymf.archive.require_libyaml()
  # errors without it, because the pure-Python dumper is ~3.2x slower and the
  # archive is written every timestep. conda-forge's pyyaml is built with it.
  - pyyaml =6.0.2
  # ymf itself has no conda-forge feedstock yet, so it is installed from git
  # until one exists. Replace this pip entry with a plain "- ymf" dependency
  # once the feedstock lands.
  #
  # proteus at runtime needs only the ymf core, whose one dependency is the
  # pyyaml above: Archiver writes the archive of record through ymf.archive.
  # But proteus also ships scripts/ymf_run, which composes and validates a
  # specification (ymf.closure -> ymf.compose, strictyaml) and turns it into
  # a Proteus problem (ymf.symbolic, sympy). So the front end is a *test*
  # dependency even though it is not a runtime one, which is why sympy and
  # strictyaml are pinned above rather than left to ymf[symbolic] -- pip
  # resolving that extra would pull its own sympy over conda's.
  #
  # Without them test_adr_problem's eight end-to-end cases skip, and
  # scripts/ymf_run is never exercised. pint (ymf[units]) stays out: nothing
  # proteus ships imports ymf.units.
  - pip:
    - git+https://github.com/proteustoolkit/ymf.git@main
    - git+https://github.com/proteustoolkit/ymf-import-gmsh.git@main
